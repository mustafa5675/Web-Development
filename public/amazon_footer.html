<!DOCTYPE html>
<html>
    <head>
        <title>Amazon Footer</title>
        <style>
            .back{
                text-align: center;
                background-color: rgb(60, 60, 60);
                color: white;
                font-size: larger;
                padding: 7px;
                
            }
            footer{
                background-color: darkgrey;
                display: grid;
                grid-template-columns: 3fr 3fr 3fr 3fr;
            }
        </style>
    </head>
    <body>
        <div class="back">Back to top</div>
        <footer>
        <div class="col">
            <div class="title">Get to Know Us</div>
            <div>About Amazon</div>
            <div>Careers</div>
            <div>Press Releases</div>
            <div>Amazon Science</div>
        </div>
        <div class="col">
            <div class="title">Connect with Us</div>
            <div>Facebook</div>
            <div>Twitter</div>
            <div>Instagram</div>
        </div>
        </footer>
    </body>
</html>
